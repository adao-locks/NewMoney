<div class="app-shell">
  <nav *ngIf="auth.user$ | async as user">
    <div class="navbar">
      <a class="brand" routerLink="/">
        <img class="brand-icon" src="assets/images/icon.png" alt="NewMoney" />
        <span>NewMoney</span>
      </a>
      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
        <a routerLink="/transacoes" routerLinkActive="active">Transações</a>
        <a routerLink="/sobre" routerLinkActive="active">Sobre</a>
        <a routerLink="/contato" routerLinkActive="active">Contato</a>
      </div>
      <div class="user-menu">
        <button type="button" class="secondary nav-user" [class.active]="profileModalOpen" (click)="openProfileModal()">
          {{ user.displayName || user.email }}
        </button>
        <button type="button" class="secondary theme-toggle" (click)="toggleTheme()">
          {{ darkMode ? 'Modo Claro' : 'Modo Escuro' }}
        </button>
        <button type="button" class="secondary nav-logout" (click)="logout()">
          Sair
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <router-outlet></router-outlet>
  </main>

  <div class="profile-modal-backdrop" *ngIf="profileModalOpen" (click)="closeProfileModal()">
    <section class="profile-modal" role="dialog" aria-modal="true" aria-label="Perfil" (click)="$event.stopPropagation()">
      <button type="button" class="profile-modal-close" (click)="closeProfileModal()" aria-label="Fechar perfil">
        ×
      </button>
      <app-perfil></app-perfil>
    </section>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 NewMoney. Todos os direitos reservados.</p>
    </div>
  </footer>
</div>
